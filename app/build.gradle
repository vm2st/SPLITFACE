plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace = 'com.vm2st.splitface'
    compileSdk = 37
    defaultConfig {
        applicationId = 'com.vm2st.splitface'
        minSdk = 23
        targetSdk = 37
        versionCode = 2
        versionName = '1.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            // Robolectric's Android 16 FileDescriptor bridge needs this JDK 21 export.
            jvmArgs '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED'
        }
    }
    lint {
        abortOnError = true
        warningsAsErrors = true
        // Version notices are not code defects; upgrades require a separate compatibility review.
        disable 'NewerVersionAvailable', 'AndroidGradlePluginVersion'
    }
}

dependencies {
    testImplementation libs.junit
    testImplementation libs.robolectric
}
