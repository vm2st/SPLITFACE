[versions]
agp = "9.4.1"
kotlin = "2.4.21"
junit = "4.13.2"
robolectric = "4.17"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }

robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }

commons-lang3 = { module = "org.apache.commons:commons-lang3", version = "3.18.0" }
jose4j = { module = "org.bitbucket.b_c:jose4j", version = "0.9.6" }
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version = "1.85" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version = "1.85" }
bouncycastle-util = { module = "org.bouncycastle:bcutil-jdk18on", version = "1.85" }
jdom2 = { module = "org.jdom:jdom2", version = "2.0.6.1" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
